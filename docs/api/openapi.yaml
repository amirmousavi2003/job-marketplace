          readOnly: true
        suggested_by_email:
          type: string
          format: email
          readOnly: true
        reviewed_by_email:
          type: string
          format: email
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolution_note:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        resulting:
          allOf:
          - $ref: '#/components/schemas/Skill'
          readOnly: true
      required:
      - created_at
      - id
      - resolution_note
      - resulting
      - reviewed_at
      - reviewed_by_email
      - status
      - suggested_by_email
      - text
    Application:
      type: object
      description: 'Context: `role` ("applicant" or "employer") = who is looking.'
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        cover_letter:
          type: string
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        job_post:
          type: object
          additionalProperties: {}
          readOnly: true
        applicant:
          type: object
          additionalProperties: {}
          readOnly: true
        allowed_next_statuses:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - allowed_next_statuses
      - applicant
      - cover_letter
      - id
      - job_post
      - status
      - submitted_at
      - updated_at
    ApplicationCreate:
      type: object
      properties:
        cover_letter:
          type: string
          maxLength: 3000
    ApplicationCreateRequest:
      type: object
      properties:
        cover_letter:
          type: string
          maxLength: 3000
    ApplicationDetail:
      type: object
      description: Adds the frozen resume (what the employer reviews). Same data for
        both parties.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        cover_letter:
          type: string
          readOnly: true
