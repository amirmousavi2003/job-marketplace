        queue, oldest first.
      parameters:
      - in: query
        name: lifecycle_status
        schema:
          type: string
          enum:
          - ACTIVE
          - DEACTIVATED
          - EXPIRED
        description: |-
          * `ACTIVE` - Active
          * `DEACTIVATED` - Deactivated by employer
          * `EXPIRED` - Expired
      - in: query
        name: moderation_status
        schema:
          type: string
          enum:
          - APPROVED
          - DRAFT
          - PENDING_REVIEW
          - REJECTED
        description: |-
          * `DRAFT` - Draft
          * `PENDING_REVIEW` - Pending review
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - name: page_size
        required: false
