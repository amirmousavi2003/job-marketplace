components:
  schemas:
    AdminJobPost:
      type: object
      description: 'Everything a reviewer needs: the post, who posted it, and the
        full history.'
      properties:
        id:
          type: integer
          readOnly: true
        post_type:
          allOf:
          - $ref: '#/components/schemas/PostTypeEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        employer:
          type: object
          additionalProperties: {}
          readOnly: true
        company:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/JobCategory'
          readOnly: true
        province:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        city:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        work_mode:
          allOf:
          - $ref: '#/components/schemas/WorkModeEnum'
          readOnly: true
        employment:
          allOf:
          - $ref: '#/components/schemas/EmploymentDetail'
          readOnly: true
        project:
          allOf:
          - $ref: '#/components/schemas/ProjectDetail'
          readOnly: true
        skills:
          type: array
          items:
            $ref: '#/components/schemas/JobPostSkill'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        moderation_status:
          allOf:
          - $ref: '#/components/schemas/ModerationStatusEnum'
          readOnly: true
        lifecycle_status:
          allOf:
          - $ref: '#/components/schemas/LifecycleStatusEnum'
          readOnly: true
        moderation_note:
          type: string
          readOnly: true
          description: Last reviewer note (rejection reason).
        duration_days:
          type: integer
          readOnly: true
        is_publicly_visible:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        employer_info:
          type: object
          additionalProperties: {}
          readOnly: true
        moderation_history:
          type: array
          items:
            $ref: '#/components/schemas/ModerationHistory'
          readOnly: true
      required:
      - category
      - city
      - company
      - created_at
      - description
      - duration_days
      - employer
      - employer_info
      - employment
      - expires_at
      - id
      - is_publicly_visible
      - lifecycle_status
      - moderation_history
      - moderation_note
      - moderation_status
      - post_type
      - project
      - province
      - published_at
      - skills
      - title
      - updated_at
      - work_mode
    AdminJobPostList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        post_type:
          allOf:
          - $ref: '#/components/schemas/PostTypeEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        moderation_status:
          allOf:
          - $ref: '#/components/schemas/ModerationStatusEnum'
          readOnly: true
        lifecycle_status:
          allOf:
          - $ref: '#/components/schemas/LifecycleStatusEnum'
          readOnly: true
        employer_name:
          type: string
          readOnly: true
        employer_email:
          type: string
          format: email
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - employer_email
      - employer_name
      - id
      - lifecycle_status
      - moderation_status
      - post_type
      - title
      - updated_at
    AdminJobTitleSuggestion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SuggestionStatusEnum'
          readOnly: true
        suggested_by_email:
          type: string
          format: email
          readOnly: true
        reviewed_by_email:
          type: string
          format: email
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolution_note:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        resulting:
          allOf:
          - $ref: '#/components/schemas/JobTitle'
          readOnly: true
      required:
      - created_at
      - id
      - resolution_note
      - resulting
      - reviewed_at
      - reviewed_by_email
      - status
      - suggested_by_email
      - text
    AdminSkillSuggestion:
