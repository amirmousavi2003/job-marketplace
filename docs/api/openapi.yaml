openapi: 3.0.3
info:
  title: Job Marketplace API
  version: 1.0.0
  description: Employment and freelance project marketplace for Iran.
paths:
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Liveness/readiness probe. Public. Checks DB connectivity.
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOk'
          description: ''
        '503':
          description: Database unavailable
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Create an account (email + password, optional Iranian mobile number). Returns the new
        account without any token: log in next.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the given refresh token. The refresh token itself is
        the credential.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: |-
        Change the password. All refresh tokens of the account are revoked, so every device must
        log in again.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: Always answers 200 so the endpoint cannot be used to discover registered
        emails.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequest'
          description: ''
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: |-
        Set a new password with the uid and token from the reset email (valid for one hour,
        single use). Revokes all refresh tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirm'
          description: ''
  /api/v1/accounts/me/:
    get:
      operationId: accounts_me_retrieve
      description: |-
        The logged-in account: email, phone, join date and roles (job seeker / employer /
        admin). Only the phone number can be edited.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: accounts_me_partial_update
      description: |-
        The logged-in account: email, phone, join date and roles (job seeker / employer /
        admin). Only the phone number can be edited.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/accounts/me/deactivate/:
    post:
      operationId: accounts_me_deactivate_create
      description: |-
        Deactivate the account (password required). Login becomes impossible and all tokens are
        revoked. For permanent deletion use the erase endpoint.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeactivateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeactivateRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/me/erase/:
    post:
      operationId: accounts_me_erase_create
      description: Permanently anonymize the account and delete its personal data.
        Cannot be undone.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EraseAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EraseAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EraseAccountRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EraseAccount'
          description: ''
  /api/v1/profiles/job-seeker/me/:
    get:
      operationId: profiles_job_seeker_me_retrieve
      description: GET / POST (create once) / PATCH the authenticated user's own profile.
      tags:
      - profiles
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSeekerProfile'
          description: ''
    post:
      operationId: profiles_job_seeker_me_create
      description: GET / POST (create once) / PATCH the authenticated user's own profile.
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSeekerProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobSeekerProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobSeekerProfileRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSeekerProfile'
          description: ''
    patch:
      operationId: profiles_job_seeker_me_partial_update
      description: GET / POST (create once) / PATCH the authenticated user's own profile.
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJobSeekerProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedJobSeekerProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedJobSeekerProfileRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSeekerProfile'
          description: ''
  /api/v1/profiles/employer/me/:
    get:
      operationId: profiles_employer_me_retrieve
      description: GET / POST (create once) / PATCH the authenticated user's own profile.
      tags:
      - profiles
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerProfile'
          description: ''
    post:
      operationId: profiles_employer_me_create
      description: GET / POST (create once) / PATCH the authenticated user's own profile.
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployerProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployerProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployerProfileRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerProfile'
          description: ''
    patch:
      operationId: profiles_employer_me_partial_update
      description: GET / POST (create once) / PATCH the authenticated user's own profile.
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployerProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmployerProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployerProfileRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerProfile'
          description: ''
  /api/v1/companies/:
    get:
      operationId: companies_list
      description: |-
        GET: companies the employer belongs to. POST: create a company; the creator becomes its
        owner. Needs an employer profile.
      parameters:
      - name: ordering
        required: false
        in: query
        description: کدام فیلد باید هنگام مرتب‌سازی نتایج استفاده شود.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: یک عبارت جستجو.
        schema:
          type: string
      tags:
      - companies
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyList'
          description: ''
    post:
      operationId: companies_create
      description: |-
        GET: companies the employer belongs to. POST: create a company; the creator becomes its
        owner. Needs an employer profile.
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
  /api/v1/companies/{id}/:
    get:
      operationId: companies_retrieve
      description: |-
        A company of the employer. Members can read; only the owner can edit (PATCH) or close it
        (DELETE deactivates it).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - companies
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    patch:
      operationId: companies_partial_update
      description: |-
        A company of the employer. Members can read; only the owner can edit (PATCH) or close it
        (DELETE deactivates it).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    delete:
      operationId: companies_destroy
      description: |-
        A company of the employer. Members can read; only the owner can edit (PATCH) or close it
        (DELETE deactivates it).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - companies
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/companies/{company_id}/members/:
    get:
      operationId: companies_members_retrieve
      description: |-
        GET: members of the company (any member). POST: add an existing employer account by
        email (owner only).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
    post:
      operationId: companies_members_create
      description: |-
        GET: members of the company (any member). POST: add an existing employer account by
        email (owner only).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/companies/{company_id}/members/{membership_id}/:
    delete:
      operationId: companies_members_destroy
      description: Remove a member (owner), or leave the company yourself. The owner
        cannot be removed.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: membership_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/locations/provinces/:
    get:
      operationId: locations_provinces_list
      description: 'Small reference data: public, not paginated.'
      tags:
      - locations
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Province'
          description: ''
  /api/v1/locations/cities/:
    get:
      operationId: locations_cities_list
      description: GET /locations/cities/?province=<id>
      tags:
      - locations
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
          description: ''
  /api/v1/resumes/me/:
    get:
      operationId: resumes_me_retrieve
      description: GET / POST (create once) / PATCH the caller's main resume.
      tags:
      - resumes
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
    post:
      operationId: resumes_me_create
      description: GET / POST (create once) / PATCH the caller's main resume.
      tags:
      - resumes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
    patch:
      operationId: resumes_me_partial_update
      description: GET / POST (create once) / PATCH the caller's main resume.
      tags:
      - resumes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedResumeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedResumeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedResumeRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
  /api/v1/resumes/me/photo/:
    get:
      operationId: resumes_me_photo_retrieve
      description: |-
        PUT multipart `photo` / GET (owner only) / DELETE. The photo is private to its owner;
        access for employers is decided together with applications (Phase 6).
      tags:
      - resumes
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoUpload'
          description: ''
    put:
      operationId: resumes_me_photo_update
      description: |-
        PUT multipart `photo` / GET (owner only) / DELETE. The photo is private to its owner;
        access for employers is decided together with applications (Phase 6).
      tags:
      - resumes
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoUpload'
          description: ''
    delete:
      operationId: resumes_me_photo_destroy
      description: |-
        PUT multipart `photo` / GET (owner only) / DELETE. The photo is private to its owner;
        access for employers is decided together with applications (Phase 6).
      tags:
      - resumes
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/resumes/me/educations/:
    post:
      operationId: resumes_me_educations_create
      description: Generic CRUD for one resume section. Lists are small and returned
        unpaginated.
      tags:
      - resumes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EducationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EducationRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Education'
          description: ''
    get:
      operationId: resumes_me_educations_list
      description: Generic CRUD for one resume section. Lists are small and returned
        unpaginated.
      tags:
      - resumes
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Education'
          description: ''
  /api/v1/resumes/me/educations/{id}/:
    patch:
      operationId: resumes_me_educations_partial_update
      description: Generic CRUD for one resume section. Lists are small and returned
        unpaginated.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این education را شناسایی میکند.
        required: true
      tags:
      - resumes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEducationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEducationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEducationRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Education'
          description: ''
    get:
      operationId: resumes_me_educations_retrieve
      description: Generic CRUD for one resume section. Lists are small and returned
        unpaginated.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این education را شناسایی میکند.
        required: true
      tags:
      - resumes
      security:
      - jwtAuth: []
      - jwtAuth: []
