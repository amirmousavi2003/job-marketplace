  /api/v1/jobs/:
    get:
      operationId: jobs_list
      description: GET /jobs/ — search all published posts (employment and projects).
        Public.
      parameters:
      - in: query
        name: budget_max
        schema:
          type: integer
      - in: query
        name: budget_min
        schema:
          type: integer
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: city
        schema:
          type: number
      - in: query
        name: employment_type
        schema:
          type: string
          enum:
          - CONTRACT
          - FULL_TIME
          - INTERNSHIP
          - PART_TIME
          - TEMPORARY
        description: |-
          * `FULL_TIME` - Full-time
          * `PART_TIME` - Part-time
          * `CONTRACT` - Contract
          * `INTERNSHIP` - Internship
          * `TEMPORARY` - Temporary
      - in: query
        name: experience_level
        schema:
          type: string
          enum:
          - JUNIOR
          - MID
          - NO_EXPERIENCE
          - SENIOR
        description: |-
          * `NO_EXPERIENCE` - No experience
          * `JUNIOR` - Junior (under 2 years)
          * `MID` - Mid-level (2 to 5 years)
          * `SENIOR` - Senior (5+ years)
      - in: query
        name: ordering
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - in: query
        name: province
        schema:
          type: number
      - in: query
        name: published_after
        schema:
          type: string
          format: date
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: salary_max
        schema:
          type: integer
      - in: query
        name: salary_min
        schema:
          type: integer
      - in: query
        name: skills
        schema:
          type: string
      - in: query
        name: skills_match
        schema:
          type: string
          enum:
          - all
          - any
        description: |-
          * `any` - any
          * `all` - all
      - in: query
        name: type
        schema:
          type: string
          enum:
          - EMPLOYMENT
          - PROJECT
        description: |-
          * `EMPLOYMENT` - Employment
          * `PROJECT` - Freelance project
      - in: query
        name: work_mode
        schema:
          type: string
          enum:
          - HYBRID
          - ON_SITE
          - REMOTE
        description: |-
          * `ON_SITE` - On-site
          * `REMOTE` - Remote
          * `HYBRID` - Hybrid
      tags:
      - jobs
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicJobPostListList'
          description: ''
